name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend
      - name: Type check
        run: npx tsc --noEmit
        working-directory: backend
      - name: Test
        run: npm test
        working-directory: backend
      - name: Build
        run: npm run build
        working-directory: backend

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Build (type check runs as part of it)
        run: npm run build
        working-directory: frontend

  ai-services:
    name: AI Services (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-services/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: ai-services
      - name: Import check
        run: python -c "import app.main; print('FastAPI app imports cleanly')"
        working-directory: ai-services
      - name: Sandbox tests
        run: python -m unittest discover -s tests -v
        working-directory: ai-services

  schemas:
    name: Prisma schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Validate PostgreSQL schema
        run: npx prisma validate --schema prisma/schema.prisma
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
      - name: Validate SQLite schema
        run: npx prisma validate --schema prisma/schema.local.prisma
        working-directory: backend
        env:
          DATABASE_URL: file:./dev.db
